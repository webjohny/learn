<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="description" content="Флеш-картки для розмовної англійської: інтервальні повторення, TTS, свайпи, офлайн." />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Phrase Deck — розмовна англійська</title>
    <script>
      // Ставимо тему до першого малювання, інакше на світлій темі блимає темний фон.
      ;(function () {
        try {
          var saved = JSON.parse(localStorage.getItem('phrase-deck-v1') || 'null')
          var theme = saved && saved.state && saved.state.settings && saved.state.settings.theme
          if (theme !== 'light' && theme !== 'dark') {
            theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? '#0b0f17' : '#f6f7fb')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
